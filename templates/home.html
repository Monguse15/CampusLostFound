<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f6f8;
        }

        header{
            background:#003366;
            color:white;
            padding:20px;
            text-align:center;
        }

        h1{
            margin:0;
        }

        .hero{
            text-align:center;
            padding:60px;
        }

        .hero h2{
            color:#003366;
            font-size:35px;
        }

        .hero p{
            font-size:18px;
            color:#555;
        }

        button{
            background:#0059b3;
            color:white;
            border:none;
            padding:15px 25px;
            margin:10px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#003d80;
        }

        .posts{
            width:80%;
            margin:auto;
            margin-top:40px;
        }

        .card{
            background:white;
            padding:20px;
            margin:15px 0;
            border-radius:10px;
            box-shadow:0px 2px 8px rgba(0,0,0,0.2);
        }

    </style>

</head>

<body>

<header>

    <h1>Campus Lost & Found</h1>

</header>

<div class="hero">

    <h2>Lost Something? Found Something?</h2>

    <p>
        Report lost items, report found items, and help reunite people with their belongings.
    </p>

    <a href="/report-lost">
    <button>Report Lost Item</button>
</a>

    <a href="/report-found">
    <button>Report Found Item</button>
</a>

   <a href="/search">
    <button>Search Items</button>
</a>

</div>

<div class="posts">

<h2>Latest Posts</h2>

<div class="card">

<h3>📱 Lost iPhone 13</h3>

<p>Location: Library</p>

</div>

<div class="card">

<h3>🎒 Found Black Backpack</h3>

<p>Location: Cafeteria</p>

</div>

<div class="card">

<h3>⌚ Lost Smart Watch</h3>

<p>Location: basketball Court</p>

</div>

</div>

<div class="posts">
    ...
</div>

<a href="/login">
    <button>Login</button>
</a>

</body>
</html>
