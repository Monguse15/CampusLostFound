<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit {{ report_type }} Report</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="form-container">

    <h1>✏️ Edit {{ report_type }} Report</h1>


    <form method="POST">

        <!-- Item Name -->

        <label>Item Name</label>

        <input
            type="text"
            name="item_name"
            value="{{ item.item_name }}"
            required
        >


        <!-- Category -->

        <label>Category</label>

        <select name="category" required>

            <option value="">Select Category</option>

            <option value="Electronics"
                {% if item.category == "Electronics" %}selected{% endif %}>
                Electronics
            </option>

            <option value="Bag"
                {% if item.category == "Bag" %}selected{% endif %}>
                Bag
            </option>

            <option value="Books"
                {% if item.category == "Books" %}selected{% endif %}>
                Books
            </option>

            <option value="ID Card"
                {% if item.category == "ID Card" %}selected{% endif %}>
                ID Card
            </option>

            <option value="Keys"
                {% if item.category == "Keys" %}selected{% endif %}>
                Keys
            </option>

            <option value="Other"
                {% if item.category == "Other" %}selected{% endif %}>
                Other
            </option>

        </select>


        <!-- Location -->

        <label>Location</label>

        <input
            type="text"
            name="location"
            value="{{ item.location }}"
            required
        >


        <!-- Description -->

        <label>Description</label>

        <textarea
            name="description"
            rows="5"
            required
        >{{ item.description }}</textarea>


        <!-- Phone -->

        <label>Phone Number</label>

        <input
            type="tel"
            name="phone"
            value="{{ item.phone }}"
        >


        <!-- Email -->

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            value="{{ item.email }}"
        >


        <!-- Save -->

        <button type="submit">
            💾 Save Changes
        </button>

    </form>


    <br>


    <!-- Cancel -->

    <a href="{{ url_for('dashboard') }}"
       class="home-btn">
        ⬅️ Cancel
    </a>

</div>

</body>

</html>
