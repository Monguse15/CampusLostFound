<form>

    <label><b>Item Name</b></label><br>
    <input type="text" name="item_name" required><br><br>

    <label><b>Category</b></label><br>
    <select name="category" required>
        <option value="">Select Category</option>
        <option>Phone</option>
        <option>Laptop</option>
        <option>Wallet</option>
        <option>Keys</option>
        <option>ID Card</option>
        <option>Bag</option>
        <option>Watch</option>
        <option>Clothes</option>
        <option>Books</option>
        <option>Other</option>
    </select><br><br>

    <label><b>Location Lost</b></label><br>
    <input type="text" name="location" required><br><br>

    <label><b>Description of the Item</b></label><br>
    <textarea name="description" rows="5" cols="50"
    placeholder="Describe the item (color, brand, size, identifying marks...)"></textarea><br><br>

    <label><b>Attach Image (Optional)</b></label><br>
    <input type="file" name="image"><br><br>

    <label><b>Phone Number</b></label><br>
    <input type="tel" name="phone" placeholder="9876543210" required><br><br>

    <label><b>Email Address</b></label><br>
    <input type="email" name="email" placeholder="example@gmail.com" required><br><br>

    <button type="submit">Submit Report</button>

</form>
